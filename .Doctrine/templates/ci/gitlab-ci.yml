# Doctrine gate suite - GitLab CI
# Parity with .github/workflows/doctrine.yml: one scope-aware entrypoint.
# Install with: python tools/doctrine_install.py --target . --ci
#               --ci-provider gitlab
#
# The gates are the same command you run locally (one-command truth,
# skills/repo-devops.md); nothing here is CI-only.

stages:
  - verify

.doctrine-verify:
  stage: verify
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - python --version
  script:
    # Ruff isn't pre-installed on the image; doctrine_verify.py checks
    # availability but does not install it. Pinned, not floating.
    - pip install --quiet ruff==0.15.15
    # Scope-aware (ADR-002 / ADR-012): full suite (lint -> ruff -> tests ->
    # gold -> state) in the Doctrine source repo; lint + gold + state only
    # in a consumer repo (a host's own tools/tests are its own tooling's
    # job, never Doctrine's ruff config or test runner).
    - python tools/doctrine_verify.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

doctrine:python-3.11:
  extends: .doctrine-verify
  variables:
    PYTHON_VERSION: "3.11"

doctrine:python-3.12:
  extends: .doctrine-verify
  variables:
    PYTHON_VERSION: "3.12"

# Gold-build deploy gate. Deployment is a promotion, not a build: the record
# must exist and re-verify before anything ships
# (standards/merge-and-promotion.md). Add --require-signature once the team's
# signing keys are configured, and this refuses an unsigned promotion.
doctrine:gold-check:
  stage: verify
  image: python:3.12-slim
  script:
    - python tools/doctrine_gold.py check --tag "$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
