name: doctrine

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest covers the cp1252-pipe output class by environment
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Corpus lint (doctrine self-consistency gate)
        run: python tools/doctrine_lint.py
      - name: Ruff (python profile lint)
        run: pip install --quiet ruff==0.15.15 && python -m ruff check tools tests
      - name: State-plane + lint test suite
        run: python -m unittest discover -s tests -v
