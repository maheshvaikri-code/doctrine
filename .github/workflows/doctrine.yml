name: doctrine

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        # windows-latest covers the cp1252-pipe output class by environment
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Corpus lint (doctrine self-consistency gate)
        run: python tools/doctrine_lint.py
      - name: Ruff (python profile lint)
        run: pip install --quiet ruff==0.15.15 && python -m ruff check tools tests
      - name: State-plane + lint test suite
        run: python -m unittest discover -s tests -v
