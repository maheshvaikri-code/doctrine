# Doctrine gate suite - Azure DevOps
# Parity with .github/workflows/doctrine.yml: one scope-aware entrypoint.
# Install with: python tools/doctrine_install.py --target . --ci
#               --ci-provider azure
#
# The gate is the same command you run locally (one-command truth,
# skills/repo-devops.md); nothing here is CI-only.

trigger:
  - main

pr:
  - main

strategy:
  matrix:
    linux-py311:
      imageName: "ubuntu-latest"
      pythonVersion: "3.11"
    linux-py312:
      imageName: "ubuntu-latest"
      pythonVersion: "3.12"
    # windows covers the cp1252-pipe output class by environment, not by
    # hoping someone remembers it
    windows-py312:
      imageName: "windows-latest"
      pythonVersion: "3.12"

pool:
  vmImage: $(imageName)

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "$(pythonVersion)"
    displayName: "Use Python $(pythonVersion)"

  # Ruff isn't pre-installed on the image; doctrine_verify.py checks
  # availability but does not install it. Pinned, not floating.
  - script: pip install --quiet ruff==0.15.15
    displayName: "Install ruff (pinned; a moving linter is a moving gate)"

  # Scope-aware (ADR-002 / ADR-012): full suite (lint -> ruff -> tests ->
  # gold -> state) in the Doctrine source repo; lint + gold + state only in
  # a consumer repo (a host's own tools/tests are its own tooling's job).
  - script: python tools/doctrine_verify.py
    displayName: "Doctrine verify (scope-aware)"
