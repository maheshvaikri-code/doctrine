name: doctrine

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Corpus lint (doctrine self-consistency gate)
        run: python tools/doctrine_lint.py
      - name: State-plane + lint test suite
        run: python -m unittest discover -s tests -v
