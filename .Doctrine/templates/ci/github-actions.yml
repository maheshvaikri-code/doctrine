name: doctrine

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest covers the cp1252-pipe output class by environment
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # Ruff isn't pre-installed on the runner; doctrine_verify.py checks
      # availability but does not install it (installing packages is not
      # its job). Pinned here, not floating, so a moving linter never moves
      # the gate under us.
      - name: Install ruff (pinned; a moving linter is a moving gate)
        run: pip install --quiet ruff==0.15.15
      # One entrypoint, not four re-implemented steps: doctrine_verify.py is
      # scope-aware (ADR-002) - full suite (lint -> ruff -> tests -> gold ->
      # state) here in the source repo, lint+gold+state only in a consumer.
      # This used to be four separate steps that ran ruff and unittest
      # unconditionally against tools/tests, duplicating (and drifting from)
      # doctrine_verify.py's scoping logic - so a consumer repo that
      # installed this same file via --ci inherited the exact defect
      # ADR-002 already fixed elsewhere: Doctrine's ruff config flooding the
      # host's own code with findings, and Doctrine's own test suite
      # running (and hanging) inside the host's. See
      # docs/adr/012-ci-templates-scope-aware-verify.md.
      - name: "Doctrine verify (scope-aware: source repo runs the full suite)"
        run: python tools/doctrine_verify.py
