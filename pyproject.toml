[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doctrineos"
version = "0.7.0"
description = "The Doctrine System: a gated engineering operating system for AI coding agents - roles, skills, adversarial review gates, hash-chained session state, gold-build deployment."
readme = ".Doctrine/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mahesh Vaikri", email = "mahesh.vaikri.ai@gmail.com" }]
keywords = ["ai-agents", "agents-md", "engineering-process", "claude-code", "mcp"]

[project.scripts]
doctrine-state = "doctrine_state:main"
doctrine-lint = "doctrine_lint:main"
doctrine-gold = "doctrine_gold:main"
doctrine-mcp = "doctrine_mcp:main"
doctrine-install = "doctrine_install:main"
doctrine-metrics = "doctrine_metrics:main"
doctrine-signature = "doctrine_signature:main"
doctrine-awaken = "doctrine_awaken:main"
doctrine-dashboard = "doctrine_dashboard:main"
doctrine-guard = "doctrine_guard:main"
doctrine-fleet = "doctrine_fleet:main"

[tool.setuptools]
package-dir = { "" = "tools" }
py-modules = [
  "doctrine_state",
  "doctrine_lint",
  "doctrine_gold",
  "doctrine_mcp",
  "doctrine_install",
  "doctrine_metrics",
  "doctrine_signature",
  "doctrine_awaken",
  "doctrine_dashboard",
  "doctrine_guard",
  "doctrine_fleet",
]

[tool.ruff]
line-length = 88
